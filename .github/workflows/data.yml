name: Refresh traffic data

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/fetch_aadt.py"
      - ".github/workflows/data.yml"
  schedule:
    - cron: "17 9 3 * *"   # 3rd of each month, 09:17 UTC

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pull Bexar County AADT stations from TxDOT
        run: python scripts/fetch_aadt.py 15 data/bexar-aadt.json
      - name: Commit if changed
        run: |
          git config user.name "stakeout-data-bot"
          git config user.email "stakeout-data-bot@users.noreply.github.com"
          git add data/bexar-aadt.json
          if git diff --cached --quiet; then echo "No change"; exit 0; fi
          git commit -m "Refresh Bexar AADT data"
          git push
